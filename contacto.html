<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Mercado Verde</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="">
  <header class="cabecera">
    <nav aria-label="Menú principal">
      <a class="logo" href="index.html">🛒 Mercado Verde</a>
      <ul class="menu">
        <li><a href="index.html" >Inicio</a></li>
        <li><a href="productos.html" >Productos</a></li>
        <li><a href="carrito.html" >Carrito</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
        <li><a href="login.html" >Ingresar</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Contáctanos</h1>
    <section class="pago">
      <form class="formulario" action="#" method="post">
        <h2>Escríbenos</h2>
        <label>Nombre
          <input type="text" name="nombre" placeholder="Tu nombre" required>
        </label>
        <label>Correo electrónico
          <input type="email" name="correo" placeholder="correo@ejemplo.com" required>
        </label>
        <label>Mensaje
          <textarea name="mensaje" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>
        </label>
        <button class="boton" type="submit">Enviar mensaje</button>
      </form>

      <form class="formulario" action="#" method="post">
        <h2>Reserva tu entrega</h2>
        <label>Nombre
          <input type="text" name="nombre" placeholder="Tu nombre" required>
        </label>
        <label>Teléfono
          <input type="tel" name="telefono" placeholder="7000-0000" pattern="[0-9]{4}-[0-9]{4}" title="Formato 0000-0000" required>
        </label>
        <section class="fila-doble">
          <label>Fecha
            <input type="date" name="fecha" required>
          </label>
          <label>Horario
            <select name="horario" required>
              <option value="">Elige uno</option>
              <option>Mañana (8:00 - 12:00)</option>
              <option>Tarde (12:00 - 18:00)</option>
            </select>
          </label>
        </section>
        <button class="boton" type="submit">Reservar</button>
      </form>
    </section>
  </main>
  <footer class="pie">
    <p>&copy; 2026 Mercado Verde. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
