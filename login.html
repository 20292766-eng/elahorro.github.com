<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Mercado Verde</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-login">
  <header class="cabecera">
    <nav aria-label="Menú principal">
      <a class="logo" href="index.html">🛒 Mercado Verde</a>
      <ul class="menu">
        <li><a href="index.html" >Inicio</a></li>
        <li><a href="productos.html" >Productos</a></li>
        <li><a href="carrito.html" >Carrito</a></li>
        <li><a href="contacto.html" >Contacto</a></li>
        <li><a href="login.html" aria-current="page">Ingresar</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <form class="formulario" action="#" method="post">
      <h1>Iniciar sesión</h1>
      <label>Correo electrónico
        <input type="email" name="correo" placeholder="correo@ejemplo.com" autocomplete="email" required>
      </label>
      <label>Contraseña
        <input type="password" name="clave" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="current-password" required>
      </label>
      <button class="boton" type="submit">Ingresar</button>
      <p>¿No tienes cuenta? <a href="#">Regístrate</a></p>
    </form>
  </main>
  <footer class="pie">
    <p>&copy; 2026 Mercado Verde. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
